<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Generatore Tagliandini iPhone</title>

<style>
  :root{
    --a4-w: 210mm;
    --a4-h: 297mm;

    --col-left: 41.28mm;
    --col-top: 40.39mm;

    --col-w: 87.49mm;
    --tag-h: 64.20mm;

    --font: Impact, Haettenschweiler, "Arial Black", sans-serif;

    --bg:#0b1220;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border: rgba(148,163,184,.22);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    background: radial-gradient(1200px 700px at 25% 10%, #14224b 0%, var(--bg) 60%);
    color: var(--text);
  }

  .app{
    max-width: 1150px;
    margin: 0 auto;
    padding: 20px;
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:16px;
  }

  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    box-shadow: 0 16px 36px rgba(0,0,0,.35);
    position: sticky;
    top:16px;
    height: fit-content;
  }

  .panel h1{
    margin:0 0 6px 0;
    font-size:18px;
  }

  .panel p{
    margin:0 0 14px 0;
    font-size:13px;
    color: var(--muted);
    line-height:1.35;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }

  .full{
    grid-column: 1 / -1;
  }

  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:0 0 6px 0;
  }

  select, input{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:1px solid var(--border);
    background: rgba(2,6,23,.35);
    color: var(--text);
    outline:none;
  }

  .manualBox{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }

  .manualActions{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:10px;
  }

  .btns{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top:12px;
  }

  button{
    border:none;
    border-radius:14px;
    padding:11px 12px;
    cursor:pointer;
    font-weight:800;
    letter-spacing:.2px;
  }

  .primary{
    background: linear-gradient(180deg, #22c55e, #16a34a);
    color:#052e16;
  }

  .outline{
    background: transparent;
    color: var(--text);
    border:1px solid var(--border);
  }

  .danger{
    background: rgba(239,68,68,.16);
    color:#fecaca;
    border:1px solid rgba(239,68,68,.35);
  }

  .secondary{
    background: rgba(148,163,184,.18);
    color: var(--text);
    border:1px solid var(--border);
  }

  .stage{
    background: rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
  }

  .paperPreview{
    width: min(680px, 100%);
    aspect-ratio: 210 / 297;
    background:#fff;
    border-radius:14px;
    box-shadow: 0 16px 34px rgba(0,0,0,.35);
    position: relative;
    overflow: hidden;
  }

  .stack{
    position:absolute;
    left: var(--col-left);
    top: var(--col-top);
    width: var(--col-w);
    border: 1px solid #000;
    background:#fff;
  }

  .tag{
    position: relative;
    width: 100%;
    height: var(--tag-h);
    border-top: 1px solid #000;
    background:#fff;
    overflow:hidden;
    font-family: var(--font);
    color:#000;
  }

  .tag:first-child{
    border-top:none;
  }

  .t-offerta{
    position:absolute;
    top: 2.245mm;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28pt;
    font-weight: 400;
    letter-spacing: 0.2pt;
    white-space: nowrap;
  }

  .t-model{
    position:absolute;
    top: 15.824mm;
    left: 50%;
    transform: translateX(-50%);
    font-size: 31pt;
    line-height: 1.02;
    text-align:center;
    width: calc(var(--col-w) - 28mm);
    white-space: normal;
  }

  .t-state{
    position:absolute;
    top: 31.164mm;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12pt;
    letter-spacing: 0.8pt;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .t-memory{
    position:absolute;
    top: 37.102mm;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20pt;
    white-space: nowrap;
  }

  .t-price{
    position:absolute;
    top: 46.999mm;
    left: 50%;
    transform: translateX(-50%);
    font-size: 31pt;
    white-space: nowrap;
  }

  /* Quando OFFERTA viene rimossa, il blocco testuale viene riequilibrato */
  .tag.no-offer .t-offerta{
    display:none;
  }

  .tag.no-offer .t-model{
    top: 8.7mm;
  }

  .tag.no-offer .t-state{
    top: 30.2mm;
  }

  .tag.no-offer .t-memory{
    top: 37.2mm;
  }

  .tag.no-offer .t-price{
    top: 47.0mm;
  }

  .logo-compass{
    position:absolute;
    left: 61.9125mm;
    top: 35.8679mm;
    width: 23.0188mm;
    height: 6.35mm;
    object-fit: contain;
  }

  .klarna-wrap{
    position:absolute;
    left: 63.5mm;
    top: 48.7580mm;
    width: 19.8438mm;
    height: 8.4667mm;
    background: #f7a8c7;
    border-radius: 999px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .logo-klarna{
    width: 92%;
    height: 92%;
    object-fit: contain;
  }

  @media print{
    @page { size: A4; margin: 0; }

    body{
      background:#fff !important;
    }

    .panel{
      display:none !important;
    }

    .app{
      display:block;
      padding:0;
      max-width:none;
    }

    .stage{
      border:none;
      box-shadow:none;
      padding:0;
      background:transparent;
    }

    .paperPreview{
      width: var(--a4-w);
      height: var(--a4-h);
      aspect-ratio: auto;
      border-radius:0;
      box-shadow:none;
    }

    .tag{
      page-break-inside: avoid;
    }
  }

  @media (max-width: 980px){
    .app{
      grid-template-columns: 1fr;
    }

    .panel{
      position:relative;
      top:auto;
    }

    .paperPreview{
      width:100%;
    }
  }
</style>
</head>

<body>
  <div class="app">
    <aside class="panel">
      <h1>Generatore Tagliandini</h1>
      <p>
        Layout 1:1 con il PDF, con modelli manuali e opzione per mostrare/nascondere “OFFERTA”.
        <br>Nel repository devono esserci <b>compass.png</b> e <b>klarna.png</b>.
      </p>

      <div class="grid">
        <div>
          <label for="model">Modello</label>
          <select id="model"></select>
        </div>

        <div>
          <label for="memory">Memoria</label>
          <select id="memory">
            <option value="64GB">64GB</option>
            <option value="128GB">128GB</option>
            <option value="256GB">256GB</option>
            <option value="512GB">512GB</option>
            <option value="1TB">1TB</option>
            <option value="-">Senza memoria</option>
          </select>
        </div>

        <div>
          <label for="state">Stato</label>
          <select id="state">
            <option value="NUOVO">NUOVO</option>
            <option value="PARI AL NUOVO">PARI AL NUOVO</option>
            <option value="USATO">USATO</option>
            <option value="RICONDIZIONATO">RICONDIZIONATO</option>
          </select>
        </div>

        <div>
          <label for="showOffer">Scritta OFFERTA</label>
          <select id="showOffer">
            <option value="yes">Mostra OFFERTA</option>
            <option value="no">Rimuovi OFFERTA</option>
          </select>
        </div>

        <div class="full">
          <label for="price">Prezzo (€)</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="Es: 149.99">
        </div>
      </div>

      <div class="manualBox">
        <label for="manualModel">Aggiungi modello manuale</label>
        <input id="manualModel" type="text" placeholder="Es: AirPods Pro 2, iPad Air, Apple Watch S9">

        <div class="manualActions">
          <button class="secondary" id="addModel">Aggiungi modello</button>
          <button class="danger" id="resetModels">Reset manuali</button>
        </div>
      </div>

      <div class="btns">
        <button class="primary" id="add">Aggiungi</button>
        <button class="outline" id="print">Stampa</button>
        <button class="danger" id="clear">Svuota</button>
      </div>
    </aside>

    <main class="stage">
      <div class="paperPreview">
        <div class="stack" id="stack"></div>
      </div>
    </main>
  </div>

<script>
  const COMPASS_SRC = "./compass.png";
  const KLARNA_SRC  = "./klarna.png";

  const DEFAULT_MODELS = [
    "iPhone 11",
    "iPhone 11 Pro",
    "iPhone 11 Pro Max",

    "iPhone SE (2ª gen)",
    "iPhone 12 mini",
    "iPhone 12",
    "iPhone 12 Pro",
    "iPhone 12 Pro Max",

    "iPhone 13 mini",
    "iPhone 13",
    "iPhone 13 Pro",
    "iPhone 13 Pro Max",

    "iPhone SE (3ª gen)",
    "iPhone 14",
    "iPhone 14 Plus",
    "iPhone 14 Pro",
    "iPhone 14 Pro Max",

    "iPhone 15",
    "iPhone 15 Plus",
    "iPhone 15 Pro",
    "iPhone 15 Pro Max",

    "iPhone 16",
    "iPhone 16e",
    "iPhone 16 Plus",
    "iPhone 16 Pro",
    "iPhone 16 Pro Max",

    "iPhone 17",
    "iPhone 17e",
    "iPhone 17 Air",
    "iPhone 17 Pro",
    "iPhone 17 Pro Max"
  ];

  const STORAGE_KEY = "tagliandini_modelli_manuali_v1";

  const $ = (id) => document.getElementById(id);

  function euro(v){
    const n = Number(v);
    if (!isFinite(n)) return "";
    return n.toFixed(2).replace(".", ",");
  }

  function escapeHTML(str){
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getManualModels(){
    try{
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    }catch(e){
      return [];
    }
  }

  function saveManualModels(models){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(models));
  }

  function getAllModels(){
    const manual = getManualModels();
    return [...DEFAULT_MODELS, ...manual];
  }

  function initModels(selectedValue = null){
    const sel = $("model");
    sel.innerHTML = "";

    getAllModels().forEach(m=>{
      const o = document.createElement("option");
      o.value = m;
      o.textContent = m;
      sel.appendChild(o);
    });

    if (selectedValue) {
      sel.value = selectedValue;
    }
  }

  function addManualModel(){
    const input = $("manualModel");
    const value = input.value.trim();

    if (!value){
      alert("Scrivi il nome del modello da aggiungere.");
      return;
    }

    const allModels = getAllModels();

    if (allModels.some(m => m.toLowerCase() === value.toLowerCase())){
      alert("Questo modello è già presente.");
      input.value = "";
      return;
    }

    const manual = getManualModels();
    manual.push(value);
    saveManualModels(manual);

    initModels(value);
    input.value = "";
  }

  function resetManualModels(){
    if (!confirm("Vuoi eliminare tutti i modelli aggiunti manualmente?")){
      return;
    }

    localStorage.removeItem(STORAGE_KEY);
    initModels();
  }

  function formatModelHTML(model){
    let safe = escapeHTML(model);

    if (safe.includes(" Pro Max")) {
      return safe.replace(" Pro Max", " Pro<br>Max");
    }

    return safe
      .replace(" Plus", "<br>Plus")
      .replace(" mini", "<br>mini")
      .replace(" Air", "<br>Air")
      .replace(" Apple Watch", "Apple<br>Watch")
      .replace(" AirPods", "AirPods");
  }

  function autoFitModel(tagEl){
    const modelEl = tagEl.querySelector(".t-model");
    const stateEl = tagEl.querySelector(".t-state");

    if (!modelEl || !stateEl) return;

    modelEl.style.lineHeight = modelEl.innerHTML.includes("<br>") ? "0.95" : "1.02";

    const sizes = ["31pt", "29pt", "27pt", "25pt", "24pt", "23pt", "22pt", "21pt", "20pt", "19pt", "18pt"];

    for (const s of sizes){
      modelEl.style.fontSize = s;
      void modelEl.offsetHeight;

      const m = modelEl.getBoundingClientRect();
      const st = stateEl.getBoundingClientRect();

      if (m.bottom <= st.top - 2) break;
    }
  }

  function autoFitState(tagEl){
    const stateEl = tagEl.querySelector(".t-state");
    if (!stateEl) return;

    const sizes = ["12pt", "11pt", "10pt", "9.5pt", "9pt"];

    for (const s of sizes){
      stateEl.style.fontSize = s;
      void stateEl.offsetWidth;

      if (stateEl.scrollWidth <= stateEl.clientWidth + 2) break;
    }
  }

  function autoFitPrice(tagEl){
    const priceEl = tagEl.querySelector(".t-price");
    if (!priceEl) return;

    const sizes = ["31pt", "30pt", "29pt", "28pt", "27pt", "26pt"];

    for (const s of sizes){
      priceEl.style.fontSize = s;
      void priceEl.offsetWidth;

      if (priceEl.scrollWidth <= priceEl.clientWidth + 2) break;
    }
  }

  function makeTag({model, memory, state, price, showOffer}){
    const tag = document.createElement("div");
    tag.className = showOffer ? "tag" : "tag no-offer";

    const memoryHTML = memory === "-" ? "" : `<div class="t-memory">${escapeHTML(memory)}</div>`;

    tag.innerHTML = `
      <div class="t-offerta">OFFERTA</div>
      <div class="t-model">${formatModelHTML(model)}</div>
      <div class="t-state">${escapeHTML(state)}</div>
      ${memoryHTML}
      <div class="t-price">${euro(price)}</div>

      <img class="logo-compass" src="${COMPASS_SRC}" alt="COMPASS">
      <div class="klarna-wrap">
        <img class="logo-klarna" src="${KLARNA_SRC}" alt="Klarna">
      </div>
    `;

    return tag;
  }

  function addTag(){
    const price = $("price").value;

    if (price === "" || !isFinite(Number(price)) || Number(price) < 0){
      alert("Inserisci un prezzo valido (es. 149.99).");
      return;
    }

    const t = makeTag({
      model: $("model").value,
      memory: $("memory").value,
      state: $("state").value,
      price,
      showOffer: $("showOffer").value === "yes"
    });

    $("stack").appendChild(t);

    autoFitModel(t);
    autoFitState(t);
    autoFitPrice(t);
  }

  function clearAll(){
    $("stack").innerHTML = "";
  }

  initModels();

  $("add").addEventListener("click", addTag);
  $("print").addEventListener("click", ()=> window.print());
  $("clear").addEventListener("click", clearAll);
  $("addModel").addEventListener("click", addManualModel);
  $("resetModels").addEventListener("click", resetManualModels);

  $("manualModel").addEventListener("keydown", function(e){
    if (e.key === "Enter"){
      addManualModel();
    }
  });
</script>
</body>
</html>
